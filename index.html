<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oh une guirlande, viens on y va !</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fffbeb;
      background: linear-gradient(180deg, #6b111c 0%, #164a32 55%, #092418 100%);
      padding: 20px 14px 40px;
      position: relative;
      overflow-x: hidden;
    }

    .kitsch-bg,
    .snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .kitsch-bg {
      z-index: 0;
    }

    .snow-layer {
      z-index: 1;
    }

    .kitsch-item {
      position: absolute;
      font-size: 28px;
      opacity: 0.9;
    }

    .snowflake {
      position: absolute;
      top: -20px;
      color: #ffffff;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(-20px); }
      to { transform: translateY(105vh); }
    }

    .app {
      position: relative;
      z-index: 2;
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 6px 0 8px;
      font-size: 23px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.4;
      color: #fef9c3;
    }

    .box {
      background: rgba(14, 36, 25, 0.88);
      border: 2px solid #facc15;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .garland {
      position: relative;
      height: 115px;
      width: 100%;
    }

    .wire {
      position: absolute;
      top: 22px;
      left: 4%;
      width: 92%;
      height: 18px;
      border-top: 4px solid #fef08a;
      border-radius: 50%;
    }

    .bulbs-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 6px 0;
    }

    .bulb-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .socket {
      width: 14px;
      height: 8px;
      background: #1e293b;
      border: 1px solid #e2e8f0;
      border-radius: 3px 3px 0 0;
    }

    .bulb {
      width: 40px;
      height: 54px;
      border-radius: 50% 50% 42% 42%;
      background-color: #64748b;
      border: 2px solid #ffffff;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .bulb-btn.selected .bulb {
      transform: scale(1.08);
      box-shadow: 0 0 0 3px #fef08a;
    }

    .current-label {
      font-size: 14px;
      color: #fde047;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .colors-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .color-swatch {
      width: 62px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      cursor: pointer;
      padding: 0;
    }

    .validate-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 2px solid #fef08a;
      background: #dc2626;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .message {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
      color: #fde68a;
    }
