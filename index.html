<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Guirlande Secrète</title>
  <style>
    :root {
      --bg-1: #0b132b;
      --bg-2: #1c2541;
      --card: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg-2), var(--bg-1) 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 36px;
    }

    h1 {
      margin: 4px 0 6px;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.94rem;
      color: var(--muted);
      text-align: center;
      max-width: 440px;
    }

    /* Cadre de la guirlande */
    .garland-wrap {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px 10px 22px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
      margin-bottom: 18px;
    }

    .garland-stage {
      position: relative;
      width: 100%;
      height: 148px;
    }

    .wire-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .bulb-slot {
      position: absolute;
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .bulb-slot:active {
      transform: translate(-50%, 0) scale(0.95);
    }

    .bulb-slot.selected .socket {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .socket {
      width: 15px;
      height: 8px;
      background: #334155;
      border-radius: 3px 3px 0 0;
      border: 1px solid #64748b;
    }

    .bulb {
      width: 42px;
      height: 54px;
      border-radius: 50% 50% 42% 42% / 60% 60% 35% 35%;
      background: #334155;
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.78);
      transition: all 0.3s ease;
    }

    .bulb.lit {
      color: #0f172a;
      border-color: #ffffff;
      transform: scale(1.05);
    }

    .bulb-label {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .bulb-slot.locked .bulb-label::after {
      content: " ✓";
      color: #4ade80;
      font-weight: 700;
    }

    @keyframes shake {
      0%, 100% { transform: translate(-50%, 0) translateX(0); }
      25% { transform: translate(-50%, 0) translateX(-5px); }
      75% { transform: translate(-50%, 0) translateX(5px); }
    }

    .shake {
      animation: shake 0.28s ease;
    }

    /* Sélecteur de couleurs */
    .panel {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
    }

    .active-info {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #fde68a;
      font-weight: 600;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .color-btn {
      flex: 1 1 28%;
      min-width: 92px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .color-btn:active {
      transform: scale(0.95);
    }

    .color-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .feedback {
      min-height: 22px;
      font-size: 0.88rem;
      color: #fca5a5;
    }

    .feedback.ok {
      color: #86efac;
    }

    /* Coffre final */
    .reward {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(34, 197, 94, 0.18));
      border: 1px solid rgba(251, 191, 36, 0.6);
      text-align: center;
    }

    .reward.show {
      display: block;
    }

    .digit-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 18px;
      border-radius: 12px;
      background: #fbbf24;
      color: #0f172a;
      font-size: 1.45rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <h1>🎄 La Guirlande Secrète</h1>
  <p class="subtitle">Appuie sur une ampoule puis choisis sa couleur (jaune, bleu, rose, orange ou vert) pour allumer toute la guirlande !</p>

  <div class="garland-wrap">
    <div class="garland-stage" id="garlandStage">
      <svg class="wire-svg" id="wireSvg" viewBox="0 0 440 148" preserveAspectRatio="none">
        <path
          d="M 10,18 Q 55,46 95,22 T 180,24 T 265,20 T 350,25 T 430,16"
          fill="none"
          stroke="#64748b"
          stroke-width="3.5"
          stroke-linecap="round"
        />
      </svg>
      <div id="bulbsContainer"></div>
    </div>
  </div>

  <div class="panel">
    <div class="active-info" id="activeInfo">Ampoule n°1 sélectionnée</div>
    <div class="palette" id="palette"></div>
    <div class="feedback" id="feedback"></div>

    <div class="reward" id="rewardBox">
      <div>✨ Toutes les ampoules sont allumées !</div>
      <div id="rewardText" style="margin-top: 6px; font-size: 0.95rem;"></div>
      <div class="digit-badge" id="rewardCode"></div>
    </div>
  </div>

  <script>
    // === PERSONNALISE ICI ===
    const CONFIG = {
      // Les 5 couleurs demandées
      colors: [
        { id: "jaune",  label: "Jaune",  hex: "#facc15" },
        { id: "bleu",   label: "Bleu",   hex: "#3b82f6" },
        { id: "rose",   label: "Rose",   hex: "#f472b6" },
        { id: "orange", label: "Orange", hex: "#f97316" },
        { id: "vert",   label: "Vert",   hex: "#22c55e" }
      ],
      // Positions (en %) le long de la guirlande + bonne couleur pour chaque ampoule (1 à 5)
      bulbs: [
        { number: 1, leftPct: 12, topPx: 26, answer: "jaune" },
        { number: 2, leftPct: 31, topPx: 18, answer: "bleu" },
        { number: 3, leftPct: 50, topPx: 28, answer: "rose" },
        { number: 4, leftPct: 69, topPx: 18, answer: "orange" },
        { number: 5, leftPct: 88, topPx: 26, answer: "vert" }
      ],
      // Indice révélé quand les 5 ampoules sont allumées
      rewardMessage: "Voici ton indice pour le code final :",
      rewardCode: "★ Chiffre : 7"
    };

    const state = {
      selectedIndex: 0,
      solved: Array(CONFIG.bulbs.length).fill(false)
    };

    const bulbsContainerEl = document.getElementById("bulbsContainer");
    const wireSvgEl = document.getElementById("wireSvg");
    const paletteEl = document.getElementById("palette");
    const activeInfoEl = document.getElementById("activeInfo");
    const feedbackEl = document.getElementById("feedback");
    const rewardBoxEl = document.getElementById("rewardBox");
    const rewardTextEl = document.getElementById("rewardText");
    const rewardCodeEl = document.getElementById("rewardCode");

    function getColorObj(id) {
      return CONFIG.colors.find(c => c.id === id);
    }

    function updateWirePath() {
      const stageRect = bulbsContainerEl.parentElement.getBoundingClientRect();
      const w = stageRect.width || 440;
      const points = CONFIG.bulbs.map(b => ({
        x: (b.leftPct / 100) * w,
        y: b.topPx + 2
      }));

      wireSvgEl.setAttribute("viewBox", `0 0 ${w} 148`);
      if (points.length === 0) return;

      let d = `M 0,${Math.max(10, points[0].y - 8)}`;
      points.forEach((pt, i) => {
        const prevX = i === 0 ? 0 : points[i - 1].x;
        const prevY = i === 0 ? Math.max(10, pt.y - 8) : points[i - 1].y;
        const ctrlX = (prevX + pt.x) / 2;
        const ctrlY = Math.max(prevY, pt.y) + 12;
        d += ` Q ${ctrlX},${ctrlY} ${pt.x},${pt.y}`;
      });
      const last = points[points.length - 1];
      d += ` Q ${(last.x + w) / 2},${last.y + 10} ${w},${Math.max(10, last.y - 8)}`;

      wireSvgEl.innerHTML = `
        <path
          d="${d}"
          fill="none"
          stroke="#64748b"
          stroke-width="3.5"
          stroke-linecap="round"
        />
      `;
    }

    function renderGarland() {
      bulbsContainerEl.innerHTML = "";
      CONFIG.bulbs.forEach((bulbCfg, idx) => {
        const slot = document.createElement("div");
        slot.className = "bulb-slot";
        slot.style.left = `${bulbCfg.leftPct}%`;
        slot.style.top = `${bulbCfg.topPx}px`;

        if (idx === state.selectedIndex) slot.classList.add("selected");
        if (state.solved[idx]) slot.classList.add("locked");

        const socket = document.createElement("div");
        socket.className = "socket";

        const bulb = document.createElement("div");
        bulb.className = "bulb";
        bulb.textContent = bulbCfg.number;

        if (state.solved[idx]) {
          const c = getColorObj(bulbCfg.answer);
          bulb.classList.add("lit");
          bulb.style.background = c.hex;
          bulb.style.boxShadow = `0 0 22px ${c.hex}, 0 0 38px ${c.hex}88`;
        }

        const label = document.createElement("div");
        label.className = "bulb-label";
        label.textContent = `N°${bulbCfg.number}`;

        slot.append(socket, bulb, label);
        slot.addEventListener("click", () => {
          state.selectedIndex = idx;
          feedbackEl.textContent = "";
          feedbackEl.className = "feedback";
          render();
        });

        bulbsContainerEl.appendChild(slot);
      });

      updateWirePath();
    }

    function renderPalette() {
      paletteEl.innerHTML = "";
      const allSolved = state.solved.every(Boolean);

      CONFIG.colors.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "color-btn";
        btn.textContent = c.label;
        btn.style.background = c.hex;
        btn.disabled = allSolved || state.solved[state.selectedIndex];

        btn.addEventListener("click", () => handleGuess(c));
        paletteEl.appendChild(btn);
      });
    }

    function handleGuess(colorObj) {
      const idx = state.selectedIndex;
      const expected = CONFIG.bulbs[idx].answer;
      const slotEl = bulbsContainerEl.children[idx];

      if (colorObj.id === expected) {
        state.solved[idx] = true;
        feedbackEl.textContent = `Ampoule n°${CONFIG.bulbs[idx].number} allumée en ${colorObj.label.toLowerCase()} !`;
        feedbackEl.className = "feedback ok";

        const nextUnsolved = state.solved.findIndex(v => !v);
        if (nextUnsolved !== -1) {
          state.selectedIndex = nextUnsolved;
        }
      } else {
        feedbackEl.textContent = `Pas tout à fait ! ${colorObj.label} ne va pas sur l'ampoule n°${CONFIG.bulbs[idx].number}.`;
        feedbackEl.className = "feedback";
        slotEl.classList.remove("shake");
        void slotEl.offsetWidth;
        slotEl.classList.add("shake");
      }

      render();
    }

    function render() {
      renderGarland();
      renderPalette();

      const allSolved = state.solved.every(Boolean);
      if (allSolved) {
        activeInfoEl.textContent = "🎉 Bravo, la guirlande brille de mille feux !";
        rewardTextEl.textContent = CONFIG.rewardMessage;
        rewardCodeEl.textContent = CONFIG.rewardCode;
        rewardBoxEl.classList.add("show");
      } else {
        const currentNum = CONFIG.bulbs[state.selectedIndex].number;
        const statusTxt = state.solved[state.selectedIndex] ? " (déjà allumée)" : "";
        activeInfoEl.textContent = `Ampoule n°${currentNum} sélectionnée${statusTxt}`;
      }
    }

    window.addEventListener("resize", updateWirePath);
    render();
  </script>
</body>
</html>
