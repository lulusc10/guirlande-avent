<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oh une guirlande, viens on y va !</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fffbeb;
      background: linear-gradient(180deg, #6b111c 0%, #164a32 55%, #092418 100%);
      padding: 20px 14px 40px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    .snow-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .snowflake {
      position: fixed;
      top: -24px;
      color: #ffffff;
      pointer-events: none;
      user-select: none;
      animation-name: fallSnow;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes fallSnow {
      0% {
        transform: translateY(-24px) translateX(0px);
      }
      50% {
        transform: translateY(50vh) translateX(10px);
      }
      100% {
        transform: translateY(108vh) translateX(-10px);
      }
    }

    .boite {
      position: relative;
      z-index: 2;
      max-width: 440px;
      margin: 0 auto 16px auto;
      background: rgba(12, 32, 22, 0.9);
      border: 2px solid #facc15;
      border-radius: 18px;
      padding: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 6px 0 8px 0;
    }

    p {
      font-size: 15px;
      margin: 0 0 16px 0;
      color: #fef9c3;
    }

    .guirlande {
      position: relative;
      height: 100px;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 14px;
    }

    .fil {
      position: absolute;
      top: 14px;
      left: 5%;
      width: 90%;
      height: 14px;
      border-top: 4px solid #fef08a;
      border-radius: 50%;
    }

    .ampoule-bloc {
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .douille {
      width: 14px;
      height: 8px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #ffffff;
      border-radius: 3px 3px 0 0;
    }

    .ampoule {
      width: 38px;
      height: 52px;
      border-radius: 50% 50% 42% 42%;
      background: #64748b;
      border: 2px solid #ffffff;
    }

    .selectionnee .ampoule {
      outline: 3px solid #fef08a;
    }

    .couleurs {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 16px 0;
    }

    .btn-couleur {
      position: relative;
      z-index: 3;
      width: 60px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid #ffffff;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-valider {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background: #dc2626;
      border: 2px solid #fef08a;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-stop-son {
      display: none;
      margin: 10px auto 0 auto;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #142018;
      background: #fde047;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #retour {
      margin-top: 12px;
      font-size: 14px;
      color: #fde68a;
      min-height: 20px;
    }

    #victoire {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.45);
      border: 2px solid #fde047;
      font-size: 15px;
      line-height: 1.4;
    }
  </style>
</head>

  </div>

    <div class="couleurs">

      <button type="button" class="btn-couleur" data-color="jaune" data-hex="#facc15" style="background:#facc15;"></button>
      <button type="button" class="btn-couleur" data-color="bleu" data-hex="#3b82f6" style="background:#3b82f6;"></button>
      <button type="button" class="btn-couleur" data-color="orange" data-hex="#f97316" style="background:#f97316;"></button>
    </div>

    <button type="button" class="btn-valider" id="btnValider">Valider ma guirlande</button>
    <div id="retour"></div>
    <button type="button" class="btn-stop-son" id="btnStopSon">🔇 Couper le son</button>

    <div id="victoire">
      Youpi, merci beaucoup ! Tu peux aller voir dans la chaussette magique si jamais un lutin n'y aurait pas laissé une surprise...

  </div>
